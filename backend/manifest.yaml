apiVersion: v1
kind: ConfigMap
metadata:
  name: expense-backend
  namespace: expense
data:
  DB_HOST: expense-mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-backend
  namespace: expense
  labels:    # These are ReplicaSet labels
    project: expense
    enviroment: dev
    module: backend
spec:
  replicas: 2
  selector:
    matchLabels: # There labels are used to select the Pod and create replicas
      project: expense
      enviroment: dev
      module: backend
# This is Pod definition
  template:
    metadata:
      labels: # These are Pod labels
        project: expense
        enviroment: dev
        module: backend
    spec:
      containers:
      - name: backend
        image: ganeshguntamadugu/backend:v1
        envFrom:
          - configMapRef:
              name: expense-backend
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: expense
spec:
  type: ClusterIP
  selector:
    project: expense
    enviroment: dev
    module: backend
  ports:
    - name: backend-port
      protocol: TCP
      port: 8080
      targetPort: 8080

