apiVersion: v1
kind: ConfigMap
metadata:
  name: expense-backend
  namespace: expense
data:
  DB_HOST: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-backend
  namespace: expense
  labels:    # These are Deployment labels
    project: expense
    enviroment: dev
    module: backend
spec:
  replicas: 1
  selector:
    matchLabels: # There labels are used to select the Pod and create replicas
      project: expense
      enviroment: dev
      module: backend
# This is Pod definition
  template:
    metadata:
      labels: # These are Pod labels
        project: expense
        enviroment: dev
        module: backend
    spec:
      containers:
      - name: backend
        image: ganeshguntamadugu/backend:v1
        resources:
          requests:
            cpu: "100m"
            memory: "120Mi"
          limits:
            cpu: "150m"
            memory: "160Mi"
        envFrom:
          - configMapRef:
              name: expense-backend
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: expense
spec:
  type: ClusterIP
  selector:
    project: expense
    enviroment: dev
    module: backend
  ports:
    - name: backend-port
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: expense-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: expense-backend
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 15

