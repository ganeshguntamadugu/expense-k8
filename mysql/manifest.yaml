apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-mysql
  namespace: expense
  labels:    # These are ReplicaSet labels
    project: expense
    enviroment: dev
    module: mysql
spec:
  replicas: 1
  selector:
    matchLabels: # There labels are used to select the Pod and create replicas
      project: expense
      enviroment: dev
      module: mysql
# This is Pod definition
  template:
    metadata:
      labels: # These are Pod labels
        project: expense
        enviroment: dev
        module: mysql
    spec:
      containers:
      - name: mysql
        image: ganeshguntamadugu/mysql:v1
---
apiVersion: v1
kind: Service
metadata:
  name: expense-mysql
  namespace: expense
spec:
  type: ClusterIP
  selector:
    project: expense
    enviroment: dev
    module: mysql
  ports:
    - name: mysql-port
      protocol: TCP
      port: 3306
      targetPort: 3306

