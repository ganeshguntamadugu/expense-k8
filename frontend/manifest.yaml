apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-frontend
  namespace: expense
  labels:    # These are ReplicaSet labels
    project: expense
    enviroment: dev
    module: frontend
spec:
  replicas: 2
  selector:
    matchLabels: # There labels are used to select the Pod and create replicas
      project: expense
      enviroment: dev
      module: frontend
# This is Pod definition
  template:
    metadata:
      labels: # These are Pod labels
        project: expense
        enviroment: dev
        module: frontend
    spec:
      containers:
      - name: frontend
        image: ganeshguntamadugu/frontend:v1
---
apiVersion: v1
kind: Service
metadata:
  name: expense-frontend
  namespace: expense
spec:
  type: LoadBalancer
  selector:
    project: expense
    enviroment: dev
    module: frontend
  ports:
    - name: frontend-port
      protocol: TCP
      port: 80
      targetPort: 80

